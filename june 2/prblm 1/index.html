<html lang="en">

<body>
    <script>
        let marks= 75;
        if(marks>=80){
            console.log("A");
        }
        else if(marks>=60 && marks<=79){
            console.log("B");
        }
        else if(marks>=40 && marks<=59){
            console.log("AC");
        }
        else {
            console.log("F");
        }

    </script>

    
</body>
